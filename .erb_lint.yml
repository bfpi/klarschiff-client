---
EnableDefaultLinters: true
glob: "**/*.{html,text,js}{+*,}.erb"
exclude:
  - '**/vendor/**/*'
  - '**/node_modules/**/*'
  - 'app/views/*_mailer/*.text.erb'
linters:
  ErbSafety:
    enabled: true
    exclude:
      # client.additional_content from settings.yml is HTML of the installation, e.g. for web analytics
      - '**/app/views/layouts/application.html.erb'
  ParserErrors:
    enabled: false
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      Layout/InitialIndentation:
        Enabled: false
      Layout/LineLength:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false
      Naming/VariableNumber:
        Enabled: false
      Rails/OutputSafety:
        Exclude:
          - '**/app/views/layouts/application.html.erb'
      Style/FrozenStringLiteralComment:
        Enabled: false
